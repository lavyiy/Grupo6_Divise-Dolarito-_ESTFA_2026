# ── Blueprint de Render para Dolarito (Divise) ──────────────────────────────
# Un único Web Service que sirve el frontend React compilado y la API Express.
#
# Deploy: Render Dashboard → New + → Blueprint → elegir este repositorio.
# Te pedirá completar DATABASE_URL (tu Postgres, ej. Supabase) y
# credenciales de email (EMAIL_USER / EMAIL_PASS o RESEND_API_KEY).

services:
  - type: web
    name: dolarito
    runtime: node
    plan: free
    rootDir: codigo
    buildCommand: npm ci && npm run build && cd server && npm ci --omit=dev
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
