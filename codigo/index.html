<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Dolarito - Divise: cotizaciones y mercado en tiempo real. Dólares, euros, criptos y más." />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Divise" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Divise</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Limpieza única de service workers/cachés antiguos en desarrollo.
      // En producción este bloque no hace nada (Vite no inyecta /@vite/client).
      (function () {
        try {
          var isDev =
            !!document.querySelector('script[src="/@vite/client"]') ||
            /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
          if (!isDev) return;

          var KEY = 'divise_sw_cleaned_v2';
          if (sessionStorage.getItem(KEY) === '1') return;

          var jobs = [];
          if ('serviceWorker' in navigator) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
              })
            );
          }
          if ('caches' in window) {
            jobs.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key); }));
              })
            );
          }
          if (!jobs.length) return;

          Promise.all(jobs)
            .catch(function () {})
            .then(function () {
              sessionStorage.setItem(KEY, '1');
              location.reload();
            });
        } catch (err) {
          // Nunca bloqueamos la carga de la app por una limpieza de caché.
        }
      })();
    </script>
  </body>
</html>
